name: Deploy Discipline PWA

# Publishes docs/ on every push that touches the PWA (or by hand from the
# Actions tab). It publishes two ways so no Settings change is required:
#   A) pushes the built site to the `gh-pages` branch, which GitHub Pages
#      serves from automatically on public repos;
#   B) a GitHub Actions deployment, used if Settings → Pages → Source is
#      ever set to "GitHub Actions". B is allowed to fail.
on:
  push:
    branches:
      - main
      - claude/review-domain-infrastructure-qNX08
    paths:
      - docs/**
      - .github/workflows/deploy-pages.yml
      - .github/scripts/gen-icons.js
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate PNG app icons
        run: node .github/scripts/gen-icons.js docs

      - name: Disable Jekyll processing of the site
        run: touch docs/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"

      - name: Upload site for Actions deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy (only works once Pages source is "GitHub Actions")
        id: deployment
        uses: actions/deploy-pages@v5
