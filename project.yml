name: Discipline
options:
  bundleIdPrefix: com.discipline
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true
settings:
  SWIFT_VERSION: "5.9"
targets:
  Discipline:
    type: application
    platform: iOS
    sources:
      - path: Discipline
        excludes:
          - "**/.DS_Store"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.discipline.app
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_ENTITLEMENTS: Discipline/Discipline.entitlements
    info:
      path: Discipline/Info.plist
      properties:
        CFBundleDisplayName: Discipline
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.discipline.app.rule-evaluation
        UNUserNotificationUsageDescription: Discipline uses local notifications to enforce your self-imposed behavioral rules.
